    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8"><title>mineplayer-bot-node</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
            @keyframes warning { 0% { border-color: transparent; } 50% { border-color: #ef4444; } }
            body { background: #020617; color: #f8fafc; font-family: sans-serif; }
            .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
            .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
            .online { background: #10b981; animation: pulse 2s infinite; }
            .offline { background: #ef4444; }
            .log-box::-webkit-scrollbar { width: 4px; }
            .log-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
            .monitor-bar { position: fixed; bottom: 1.5rem; left: 1.5rem; padding: 0.75rem 1.25rem; border-radius: 1.5rem; display: flex; align-items: center; gap: 12px; z-index: 100; border: 1px solid rgba(255,255,255,0.1); }
            .warn-border { animation: warning 1s infinite; border-width: 2px; }
        </style>
    </head>
    <body class="p-6 pb-24">
        <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 hidden">
            <div class="glass rounded-3xl p-8 w-80 border-t-4 border-t-blue-500">
                <h2 class="text-xl font-black mb-1">mineplayer-bot-node</h2>
                <p class="text-[11px] text-slate-500 uppercase font-black mb-6">身份验证</p>
                <input id="login-user" placeholder="用户名" class="w-full bg-slate-950 rounded-xl px-4 py-2 text-sm text-white outline-none border border-slate-700 mb-2">
                <input id="login-pass" type="password" placeholder="密码" class="w-full bg-slate-950 rounded-xl px-4 py-2 text-sm text-white outline-none border border-slate-700 mb-4" onkeydown="if(event.key==='Enter')doLogin()">
                <div id="login-err" class="text-red-500 text-[11px] font-bold mb-2 hidden">登录失败</div>
                <button onclick="doLogin()" class="w-full bg-blue-600 py-2 rounded-xl text-sm font-bold active:scale-95 transition-all">登 录</button>
            </div>
        </div>
        <div class="max-w-7xl mx-auto">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-xl font-black bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent uppercase tracking-tighter">mineplayer-bot-node</h1>
                <div class="glass p-2 rounded-2xl flex gap-2">
                    <input id="h" oninput="saveDraft('global', 'h', this.value)" placeholder="IP:PORT" class="bg-slate-950 rounded-xl px-4 py-2 text-sm text-white outline-none border border-slate-700">
                    <input id="u" oninput="saveDraft('global', 'u', this.value)" placeholder="角色名" class="bg-slate-950 rounded-xl px-4 py-2 text-sm text-white outline-none border border-slate-700 w-32">
                    <button onclick="addBot()" class="bg-white text-black px-6 py-2 rounded-xl text-sm font-bold active:scale-95 transition-all">部署角色</button>
                    <button onclick="logout()" class="bg-slate-800 text-slate-300 px-3 py-2 rounded-xl text-sm font-bold active:scale-95 transition-all">退出</button>
                </div>
            </header>
            <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div id="mem-bar" class="monitor-bar glass">
            <div class="flex flex-col">
                <span class="text-[11px] uppercase font-black text-slate-500">Node Instance Memory</span>
                <div class="flex items-baseline gap-2">
                    <span id="mem-percent" class="text-xl font-black italic text-white">0.0%</span>
                    <span id="mem-used" class="text-[11px] font-bold text-slate-400">0 / 0 MB</span>
                </div>
            </div>
            <div class="w-32 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div id="mem-progress" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- 原生核心服务控制条: 开关/状态/启停 -->
        <div id="core-bar" class="monitor-bar glass" style="left: auto; right: 1.5rem;">
            <div class="flex flex-col">
                <span class="text-[11px] uppercase font-black text-slate-500">Core Service</span>
                <span id="core-status" class="text-[11px] font-bold text-slate-300">加载中…</span>
            </div>
            <button id="core-toggle" onclick="toggleCore()" class="bg-blue-600 px-4 py-2 rounded-xl text-[11px] font-black active:scale-95 transition-all">启动</button>
        </div>

        <script>
            let drafts = {}; 
            const TOKEN_KEY = 'pfp_token';
            let authToken = localStorage.getItem(TOKEN_KEY) || '';
            const origFetch = window.fetch;
            window.fetch = function(url, opts = {}) {
                opts.headers = opts.headers || {};
                if (authToken) opts.headers['Authorization'] = 'Bearer ' + authToken;
                return origFetch(url, opts).then(resp => {
                    if (resp.status === 401 && !String(url).startsWith('/api/login')) {
                        showLogin();
                    }
                    return resp;
                });
            };
            function showLogin() { document.getElementById('login-overlay').classList.remove('hidden'); }
            function hideLogin() { document.getElementById('login-overlay').classList.add('hidden'); }
            async function doLogin() {
                const u = document.getElementById('login-user').value.trim();
                const p = document.getElementById('login-pass').value;
                const r = await origFetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) });
                const d = await r.json();
                if (r.ok && d.token) {
                    authToken = d.token;
                    localStorage.setItem(TOKEN_KEY, d.token);
                    document.getElementById('login-err').classList.add('hidden');
                    hideLogin();
                    updateUI(true);
                } else {
                    document.getElementById('login-err').classList.remove('hidden');
                }
            }
            function logout() {
                authToken = '';
                localStorage.removeItem(TOKEN_KEY);
                showLogin();
            }

            // --- [ 原生核心服务控制 ] ---
            // 与后端 /api/core 对应: start | stop | status
            async function coreAction(action) {
                if (!authToken) return null;
                const r = await fetch('/api/core', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });
                return await r.json();
            }
            async function refreshCoreStatus() {
                if (!authToken) return;
                const d = await coreAction('status');
                if (!d || !d.success) return;
                const el = document.getElementById('core-status');
                const btn = document.getElementById('core-toggle');
                if (el) el.innerText = d.detail;
                if (btn) {
                    // running/starting 时按钮变"停止", 否则变"启动"
                    const isRunning = d.status === 'running' || d.status === 'starting';
                    btn.innerText = isRunning ? '停止' : '启动';
                    btn.className = 'px-4 py-2 rounded-xl text-[11px] font-black active:scale-95 transition-all ' +
                        (isRunning ? 'bg-red-600' : 'bg-blue-600');
                }
            }
            async function toggleCore() {
                const d = await coreAction('status');
                if (!d || !d.success) return;
                const isRunning = d.status === 'running' || d.status === 'starting';
                const btn = document.getElementById('core-toggle');
                if (btn) { btn.innerText = '处理中…'; btn.disabled = true; }
                const res = await coreAction(isRunning ? 'stop' : 'start');
                if (btn) btn.disabled = false;
                if (res && !res.success) alert('❌ ' + (res.error || '操作失败'));
                else if (res) alert(res.detail || (isRunning ? '已停止' : '已启动'));
                await refreshCoreStatus();
            }

            function saveDraft(botId, field, val) { if (!drafts[botId]) drafts[botId] = {}; drafts[botId][field] = val; }
            function getDraft(botId, field, fallback) { return (drafts[botId] && drafts[botId][field] !== undefined) ? drafts[botId][field] : (fallback || ''); }
            
            async function updateSystemStatus() {
                try {
                    const r = await fetch('/api/system/status');
                    const d = await r.json();
                    const p = parseFloat(d.percent);
                    const bar = document.getElementById('mem-bar');
                    const prog = document.getElementById('mem-progress');
                    document.getElementById('mem-percent').innerText = d.percent + '%';
                    document.getElementById('mem-used').innerText = d.used + ' / ' + d.total + ' MB';
                    prog.style.width = d.percent + '%';
                    if (p >= 80) { bar.classList.add('warn-border'); prog.classList.replace('bg-blue-500', 'bg-red-500'); }
                    else { bar.classList.remove('warn-border'); prog.classList.replace('bg-red-500', 'bg-blue-500'); }
                } catch(e) {}
            }

            async function addBot() { await fetch('/api/bots', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ host: document.getElementById('h').value, username: document.getElementById('u').value })}); drafts['global'] = {}; updateUI(true); }
            async function restartNow(id) { const r = await fetch('/api/bots/'+id+'/restart-now', { method: 'POST' }); if(r.ok) updateUI(true); }
            async function reconnectBot(id) { const r = await fetch('/api/bots/'+id+'/reconnect', { method: 'POST' }); if(r.ok) updateUI(true); }
            async function savePto(id) { const data = { url: document.getElementById('url-'+id).value, id: document.getElementById('sid-'+id).value, key: document.getElementById('key-'+id).value, defaultDir: document.getElementById('ddir-'+id).value }; await fetch('/api/bots/'+id+'/pto-config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)}); delete drafts[id]; updateUI(true); }
            async function toggle(id, type) { await fetch('/api/bots/'+id+'/toggle', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ type })}); updateUI(true); }
            async function setTimer(id, value, unit) { await fetch('/api/bots/'+id+'/set-timer', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ value, unit })}); updateUI(true); }
            async function removeBot(id) { if(confirm('移除？')) { await fetch('/api/bots/'+id, { method: 'DELETE' }); updateUI(true); } }
            async function saveNote(id) { const v = document.getElementById('note-'+id).value.trim(); const r = await fetch('/api/bots/'+id+'/note', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({note: v}) }); delete drafts[id]; updateUI(true); }
            async function testPanel(id) { const r = await fetch('/api/bots/'+id+'/test-panel', { method: 'POST' }); const d = await r.json(); alert(d.success ? ('✅ 连接成功: ' + d.name + ' (' + d.status + ')') : ('❌ ' + (d.error||'失败'))); updateUI(true); }
            async function pteroPower(id, signal) { await fetch('/api/bots/'+id+'/power', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({signal}) }); updateUI(true); }
                        async function openFiles(id) {
                const r = await fetch('/api/bots/'+id+'/files?dir=/');
                const d = await r.json();
                if(!d.success){ alert('❌ '+d.error); return; }
                const list = d.files.map(f => {
                    const a = f.attributes;
                    const icon = a.is_file ? '📄' : '📁';
                    const sz = a.is_file ? (a.size/1024).toFixed(0)+'KB' : 'dir';
                    const nameEsc = a.name.replace(/'/g, "\'");
                    const dlBtn = a.is_file
                        ? `<button onclick="downFile('${id}','${nameEsc}')" class="bg-blue-600 px-2 py-0.5 rounded text-[11px]">下载</button><button onclick="delFile('${id}','${nameEsc}')" class="bg-red-600 px-2 py-0.5 rounded text-[11px]">删除</button>`
                        : '';
                    return `<div class="flex justify-between items-center py-1 border-b border-slate-800"><span class="text-[11px]">${icon} ${a.name} <span class="text-slate-500">(${sz})</span></span><div class="flex gap-1">${dlBtn}</div></div>`;
                }).join('');
                const panel = document.getElementById('file-modal');
                if(!panel){
                    const d2 = document.createElement('div');
                    d2.id = 'file-modal';
                    d2.className = 'fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90';
                    d2.innerHTML = `<div class="glass rounded-3xl p-6 w-[90%] max-w-xl"><h2 class="text-lg font-bold mb-3">📁 文件管理</h2><div id="file-body" class="max-h-80 overflow-y-auto"></div><div class="mt-4 flex gap-2"><input type="file" id="upload-file" class="text-[11px]"><button onclick="upFile('${id}')" class="bg-emerald-600 px-3 py-1 rounded text-[11px]">上传</button><button onclick="document.getElementById('file-modal').remove()" class="bg-slate-700 px-3 py-1 rounded text-[11px]">关闭</button></div></div>`;
                    document.body.appendChild(d2);
                }
                document.getElementById('file-body').innerHTML = list;
            }
            async function downFile(id, file) { await fetch('/api/bots/'+id+'/download', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({file}) }); }
            async function delFile(id, file) { if(confirm('删除 '+file+'?')){ const r=await fetch('/api/bots/'+id+'/files/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file})}); if(r.ok) openFiles(id); } }
            async function upFile(id) { const inp=document.getElementById('upload-file'); if(!inp.files.length){alert('请选择文件');return;} const fd=new FormData(); fd.append('file',inp.files[0]); fd.append('directory','/'); const r=await fetch('/api/bots/'+id+'/upload',{method:'POST',body:fd}); const d=await r.json(); alert(d.success?'✅ 已上传':('❌ '+d.error)); openFiles(id); }
async function updateUI(force = false) {
                if (!force && document.activeElement && document.activeElement.tagName === 'INPUT') return;
                const r = await fetch('/api/bots'); const d = await r.json();
                document.getElementById('h').value = getDraft('global', 'h', document.getElementById('h').value);
                document.getElementById('u').value = getDraft('global', 'u', document.getElementById('u').value);
                document.getElementById('list').innerHTML = d.bots.map(b => `
                    <div class="glass rounded-[2.5rem] p-6 border-t-4 transition-all ${b.status==='在线'?'border-t-emerald-500 shadow-[0_-10px_30px_-15px_rgba(16,185,129,0.2)]':'border-t-red-500 shadow-[0_-10px_30px_-15px_rgba(239,68,68,0.2)]'}">
                        <div class="flex justify-between items-start mb-4">
                            <div><div class="flex items-center gap-2"><h3 class="text-xl font-bold uppercase">${b.note || b.username}</h3><span class="text-sm text-slate-400 font-mono">(${b.username})</span><span class="px-2 py-0.5 rounded-full text-[11px] font-black uppercase ${b.status==='在线'?'bg-emerald-500/20 text-emerald-400':'bg-red-500/20 text-red-400'}"><span class="status-dot ${b.status==='在线'?'online':'offline'}"></span>${b.status}</span></div><p class="text-[11px] text-slate-500">${b.host}:${b.port || 25565} <span class="ml-2 text-cyan-400 font-bold">👥 ${b.playerCount ?? 0} 人</span></p></div>
                            <button onclick="removeBot('${b.id}')" class="text-slate-600 hover:text-red-500 transition-colors">✕</button>
                        </div>
                        <div class="bg-slate-900/40 p-4 rounded-2xl border border-slate-800 mb-4">
                            <p class="text-[11px] text-slate-500 uppercase font-black mb-3">定时重启 | 下次: <span class="text-cyan-400">${b.nextRestart}</span></p>
                            <div class="grid grid-cols-2 gap-2 mb-3">
                                <div><input oninput="saveDraft('${b.id}', 'min', this.value)" id="min-${b.id}" value="${getDraft(b.id, 'min', '')}" type="number" placeholder="分钟" class="bg-slate-950 w-full rounded-lg px-2 py-1 text-[11px] text-white outline-none border border-slate-800 transition-all"><button onclick="setTimer('${b.id}', document.getElementById('min-${b.id}').value, 'min')" class="mt-1 w-full bg-slate-800 py-1 rounded-md text-[11px] font-black">设定分钟</button></div>
                                <div><input oninput="saveDraft('${b.id}', 'hour', this.value)" id="hour-${b.id}" value="${getDraft(b.id, 'hour', '')}" type="number" placeholder="小时" class="bg-slate-950 w-full rounded-lg px-2 py-1 text-[11px] text-white outline-none border border-slate-800 transition-all"><button onclick="setTimer('${b.id}', document.getElementById('hour-${b.id}').value, 'hour')" class="mt-1 w-full bg-slate-800 py-1 rounded-md text-[11px] font-black">设定小时</button></div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 mb-2">
                                <button onclick="reconnectBot('${b.id}')" class="w-full bg-blue-600 py-2 rounded-xl text-[11px] font-black uppercase shadow-lg active:scale-95 transition-all">🔁 手动重连</button>
                                <button onclick="restartNow('${b.id}')" class="w-full bg-red-600 py-2 rounded-xl text-[11px] font-black uppercase shadow-lg active:scale-95 transition-all">⚡ 立即重启 /RESTART</button>
                            </div>
                            <div class="flex gap-2 items-center">
                                <input oninput="saveDraft('${b.id}','note',this.value)" id="note-${b.id}" value="${getDraft(b.id,'note', b.note || '')}" placeholder="服务器名称" class="bg-slate-950 w-full rounded-lg px-2 py-1 text-[11px] text-white outline-none border border-slate-800">
                                <button onclick="saveNote('${b.id}')" class="bg-purple-600 px-3 py-1 rounded-lg text-[11px] font-black whitespace-nowrap">修改名称</button>
                            </div>
                        </div>
                        <div class="bg-black/40 p-4 rounded-2xl mb-4 border border-slate-800">
                            <input oninput="saveDraft('${b.id}', 'url', this.value)" id="url-${b.id}" placeholder="面板地址" value="${getDraft(b.id, 'url', b.settings.pterodactyl?.url)}" class="w-full bg-slate-900 rounded-lg px-2 py-1 text-[11px] mb-1 text-white border border-transparent focus:border-blue-500 outline-none transition-all">
                            <input oninput="saveDraft('${b.id}', 'sid', this.value)" id="sid-${b.id}" placeholder="服务器ID" value="${getDraft(b.id, 'sid', b.settings.pterodactyl?.id)}" class="w-full bg-slate-900 rounded-lg px-2 py-1 text-[11px] mb-1 text-white border border-transparent focus:border-blue-500 outline-none transition-all">
                            <input oninput="saveDraft('${b.id}', 'key', this.value)" id="key-${b.id}" type="password" placeholder="API Key" value="${getDraft(b.id, 'key', b.settings.pterodactyl?.key)}" class="w-full bg-slate-900 rounded-lg px-2 py-1 text-[11px] mb-1 text-white border border-transparent focus:border-blue-500 outline-none transition-all">
                            <input oninput="saveDraft('${b.id}', 'ddir', this.value)" id="ddir-${b.id}" placeholder="默认目录" value="${getDraft(b.id, 'ddir', b.settings.pterodactyl?.defaultDir)}" class="w-full bg-slate-950 text-emerald-400 rounded-lg px-2 py-1 text-[11px] mb-2 border border-emerald-900/30 outline-none transition-all">
                            <div class="flex gap-2 mb-2"><button onclick="savePto('${b.id}')" class="flex-1 bg-slate-800 text-[11px] py-1.5 rounded-lg font-bold">保存</button><button onclick="testPanel('${b.id}')" class="flex-1 bg-teal-600 text-[11px] py-1.5 rounded-lg font-bold">连接测试</button><button onclick="openFiles('${b.id}')" class="flex-1 bg-blue-600 text-[11px] py-1.5 rounded-lg font-bold">📁 文件</button></div>
                            <div class="flex gap-2"><button onclick="pteroPower('${b.id}','restart')" class="flex-1 bg-amber-600 text-[11px] py-1.5 rounded-lg font-bold">↻ 重启服务器</button><button onclick="pteroPower('${b.id}','start')" class="flex-1 bg-emerald-700 text-[11px] py-1.5 rounded-lg font-bold">▶ 启动</button><button onclick="pteroPower('${b.id}','stop')" class="flex-1 bg-red-700 text-[11px] py-1.5 rounded-lg font-bold">⏹ 停止</button></div>
                        </div>
                        <div class="grid grid-cols-4 gap-2 mb-4">
                            <button onclick="toggle('${b.id}','ai')" class="py-2 rounded-xl text-[11px] font-bold ${b.settings.ai?'bg-blue-600':'bg-slate-800'}">👁️ AI视角</button>
                            <button onclick="toggle('${b.id}','walk')" class="py-2 rounded-xl text-[11px] font-bold ${b.settings.walk?'bg-emerald-600':'bg-slate-800'}">👣 巡逻</button>
                            <button onclick="toggle('${b.id}','chat')" class="py-2 rounded-xl text-[11px] font-bold ${b.settings.chat?'bg-orange-600':'bg-slate-800'}">💬 喊话</button>
                            <button onclick="toggle('${b.id}','mine')" class="py-2 rounded-xl text-[11px] font-bold ${b.settings.mine?'bg-amber-600':'bg-slate-800'}">⛏️ 找矿</button>
                        </div>
                        <div class="log-box bg-black/60 rounded-xl p-3 h-32 overflow-y-auto font-mono text-[11px] border border-white/5">
                            ${b.logs.map(l => `<div class="mb-1 ${l.color}"><span class="opacity-30 mr-1">[${l.time}]</span>${l.msg}</div>`).join('')}
                        </div>
                    </div>
                `).join('');
            }
            setInterval(() => { updateUI(false); updateSystemStatus(); refreshCoreStatus(); }, 3000);
            if (!authToken) showLogin();
            updateUI(true);
        </script>
    </body>
